<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" id="favicon" href="data:,">

        <main>
            <div id="infoblurb"> <p id="except"> <strong>GOSLETT SHELL COMPANY</strong> IS A CREATIVE SERVICES OFFICE<br> OPERATED BY CREATIVE DIRECTOR LIAM GOSLETT <br>

                    <div class="clock-item" id="clock-hongkong" data-tz="Asia/Hong_Kong"   data-label="HONG KONG"></div>
                    <div id="information-tag"><a role="button" tabindex="0">INFORMATION</a></div>
                </div>
            </div>

        <script src="script.js" defer></script>
